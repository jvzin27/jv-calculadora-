
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculadora">

        <h1>🧮 Calculadora</h1>

        <input type="number" id="numero1" placeholder="Digite o primeiro número">

        <select id="operacao">
            <option value="adicao">➕ Adição</option>
            <option value="subtracao">➖ Subtração</option>
            <option value="multiplicacao">✖️ Multiplicação</option>
            <option value="divisao">➗ Divisão</option>
        </select>

        <input type="number" id="numero2" placeholder="Digite o segundo número">

        <button onclick="calcular()">CALCULAR</button>

        <div class="resultado">
            Resultado:
            <span id="resultado">0</span>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
